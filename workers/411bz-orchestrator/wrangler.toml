name = "411bz-orchestrator"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "0a99972e989785e2bf99eb4bef63dd21"

[vars]
WORKER_ID = "411bz-orchestrator"
# Fabric decision gate: off | shadow | gate. shadow writes slips and changes no decision.
FABRIC_MODE = "shadow"
# Pinned model id; every slip logs the versioned id TypeSafe reports back.
TYPESAFE_MODEL = "jev-latest"
# TYPESAFE_API_KEY is a secret: set it with `wrangler secret put TYPESAFE_API_KEY` (operator-local).

[[d1_databases]]
binding = "DB"
database_name = "orchestrator-production"
database_id = "6edc2d3f-bc03-4d97-9548-75a447ec63f3"

[[services]]
binding = "ENGINE"
service = "411bz-authority-engine"

[[services]]
binding = "EXAMINER"
service = "authority-examiner"

[[services]]
binding = "COMPILER"
service = "authority-solution-compiler"

[[services]]
binding = "FORGE"
service = "authority-content-forge"

[[services]]
binding = "OBSERVATORY"
service = "411bz-observatory"

[[services]]
binding = "SCHEMA_ENGINE"
service = "411bz-schema-engine"
